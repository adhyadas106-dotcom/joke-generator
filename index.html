<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: rgb(238, 238, 141);" class="min-h-screen flex items-center justify-center p-4">


    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center">
        <h1 style="color: crimson;" class="text-3xl font-extrabold  mb-6">Random Joke Generator</h1>

        <!-- Joke Box Container -->
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-6 mb-6 min-h-[140px] flex flex-col justify-center">
            <p id="jokeSetup" class="text-lg font-semibold text-gray-800 mb-3">Click the button bellow to get jokes</p>
            <p id="jokePunchline" class="text-md font-medium text-purple-700 italic"></p>
        </div>

        <!-- Get Joke Button -->
        <button style="background-color: crimson;"
            onclick="getJoke()" 
            class="w-full  hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg ">
            Get Joke
        </button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
